<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ARMAGGEDON - Framework de seguridad ofensiva multi-agente">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafff6"/>
      <stop offset="0.5" stop-color="#00ff9d"/>
      <stop offset="1" stop-color="#00a3ff"/>
    </linearGradient>
    <linearGradient id="bolt2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="1" stop-color="#00a3ff"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="0.5" stop-color="#0088ff"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bbg)"/>

  <!-- Rejilla de fondo -->
  <g stroke="#13233400" opacity="0.6">
    <g stroke="#132334" stroke-width="1">
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
    </g>
  </g>
  <g stroke="#0f1d2b" stroke-width="1" opacity="0.5">
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Emblema -->
  <g transform="translate(70,60)">
    <path d="M100 6 L176 50 V148 L100 192 L24 148 V50 Z" fill="#0b1623" stroke="url(#ring2)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M110 38 L74 110 H98 L86 170 L132 94 H106 Z" fill="url(#bolt2)" filter="url(#g2)" stroke="#dffff4" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="4" fill="url(#word)">ARMAGGEDON</text>
  <text x="304" y="196" font-family="'Consolas','JetBrains Mono',monospace" font-size="23" letter-spacing="2" fill="#7fd8b0">Framework de seguridad ofensiva multi-agente</text>
  <text x="304" y="232" font-family="'Consolas','JetBrains Mono',monospace" font-size="16" letter-spacing="1" fill="#5f7e90">recon &#8594; explotacion &#8594; reporte  ·  sin llaves  ·  reproducible</text>

  <!-- Acento rayo derecho -->
  <path d="M1120 40 L1092 120 H1114 L1100 240 L1152 108 H1126 Z" fill="url(#bolt2)" opacity="0.14"/>
</svg>
