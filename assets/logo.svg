<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Logo de ARMAGGEDON">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="0.5" stop-color="#00e0c3"/>
      <stop offset="1" stop-color="#00a3ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="0.5" stop-color="#0088ff"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#101a26"/>
      <stop offset="1" stop-color="#070b12"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblema hexagonal -->
  <path d="M120 14 L206 63 V177 L120 226 L34 177 V63 Z" fill="url(#bg)" stroke="url(#ring)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M120 27 L195 70 V170 L120 213 L45 170 V70 Z" fill="none" stroke="#00ff9d" stroke-width="1" stroke-opacity="0.22" stroke-linejoin="round"/>

  <!-- Rejilla sutil -->
  <g stroke="#1b3a4a" stroke-width="1" opacity="0.5">
    <line x1="60" y1="90" x2="180" y2="90"/>
    <line x1="60" y1="120" x2="180" y2="120"/>
    <line x1="60" y1="150" x2="180" y2="150"/>
  </g>

  <!-- Rayo -->
  <path d="M132 48 L92 128 H118 L104 196 L156 108 H128 Z" fill="url(#bolt)" filter="url(#glow)" stroke="#dffff4" stroke-width="2" stroke-linejoin="round"/>
</svg>
